<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#10152c,#252b50);
  font-family: Arial,sans-serif;
}
.calculator {
  width: 320px;
  padding: 20px;
  background: #171c30;
  border-radius: 25px;
  box-shadow: 0 15px 40px #0008;
}
h2 { color: white; text-align: center; }
#display {
  width: 100%;
  height: 75px;
  border: none;
  border-radius: 12px;
  background: #080d1c;
  color: white;
  font-size: 32px;
  text-align: right;
  padding: 12px;
  margin-bottom: 15px;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}
button {
  height: 60px;
  border: none;
  border-radius: 13px;
  background: #303954;
  color: white;
  font-size: 23px;
  cursor: pointer;
}
button:active { opacity: .7; }
.operator { background: #5965d9; }
.clear { background: #d94b62; }
.equal {
  background: #18a879;
  grid-column: span 2;
}
</style>
</head>
<body>
<div class="calculator">
<h2>CALCULATOR</h2>
<input id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">AC</button>
<button onclick="del()">DEL</button>
<button class="operator" onclick="add('/')">÷</button>
<button class="operator" onclick="add('*')">×</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('-')">−</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('+')">+</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('.')">.</button>
<button onclick="add('0')">0</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>
<script>
let display = document.getElementById('display');
function add(v) {
 if(display.value === 'Error') display.value = '0';
 if(display.value === '0') display.value = v;
 else display.value += v;
}
function clearDisplay() { display.value = '0'; }
function del() {
 display.value = display.value.slice(0,-1) || '0';
}
function calculate() {
 try {
  let exp = display.value;
  if(!/^[0-9+*/. -]+$/.test(exp)) throw Error();
  let result = Function('"use strict";return ('+exp+')')();
  if(!Number.isFinite(result)) throw Error();
  display.value = String(Number(result.toFixed(10)));
 } catch(e) {
  display.value = 'Error';
 }
}
</script>
</body>
</html>
